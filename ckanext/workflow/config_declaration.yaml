version: 1
groups:
  - annotation: ckanext-workflow
    options:
      - key: ckanext.workflow.ui.show_admin_tab
        type: bool
        description: Display the tab for workflows in the CKAN Admin UI.


      - key: ckan.plugins.workflow.automated_runner
        default: noop
        description: |
          The name of the automated task runner to use for executing automated
          tasks.

      - key: ckanext.workflow.automated_tasks
        type: list
        description: |
          A list of keys of automated tasks that can be executed by the
          workflow engine.
